<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="750" height="280" viewBox="0 0 198.4375 74.083333"
     version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="logoShadow" x="-0.03" y="-0.12" width="1.08" height="1.30">
      <feFlood flood-opacity="0.91" flood-color="#000000" result="flood"/>
      <feComposite in="flood" in2="SourceGraphic" operator="in" result="shadowMask"/>
      <feGaussianBlur in="shadowMask" stdDeviation="0.6" result="blur"/>
      <feOffset in="blur" dx="1.5" dy="1.75" result="offset"/>
      <feComposite in="SourceGraphic" in2="offset" operator="over"/>
    </filter>
  </defs>

  <text x="5.5" y="34.6"
        textLength="130.5" lengthAdjust="spacingAndGlyphs"
        style="font-weight:700;font-size:30.5px;font-family:Jura,Arial,sans-serif;fill:#ffffff;filter:url(#logoShadow)">AISURVIV</text>

  <text x="139" y="34.6"
        style="font-weight:700;font-size:30.5px;font-family:Jura,Arial,sans-serif;fill:#ffe400;filter:url(#logoShadow)">.IO</text>

  <text x="10.6" y="69.1"
        style="font-weight:700;font-size:22.7542px;font-family:Jura,Arial,sans-serif;fill:#00ff0f">BATTLE ROYALE</text>

  <rect x="2.0777" y="3.6777" width="191.415" height="39.5693"
        fill="none" stroke="#ffffff" stroke-width="2.9554"
        stroke-linecap="round" stroke-linejoin="miter"/>
</svg>

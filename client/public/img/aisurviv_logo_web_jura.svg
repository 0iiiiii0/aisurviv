<?xml version="1.0" encoding="UTF-8"?>
<svg width="750" height="280" viewBox="0 0 198.4375 74.083333"
     xmlns="http://www.w3.org/2000/svg">
  <style>
    @font-face {
      font-family: "JuraRemote";
      src: url("https://raw.githubusercontent.com/google/fonts/main/ofl/jura/Jura%5Bwght%5D.ttf") format("truetype");
      font-weight: 100 900;
    }
  </style>
  <defs>
    <filter id="logoShadow" x="-0.03" y="-0.12" width="1.08" height="1.30">
      <feFlood flood-opacity="0.91" flood-color="#000" result="flood"/>
      <feComposite in="flood" in2="SourceGraphic" operator="in" result="mask"/>
      <feGaussianBlur in="mask" stdDeviation="0.6" result="blur"/>
      <feOffset in="blur" dx="1.5" dy="1.75" result="offset"/>
      <feComposite in="SourceGraphic" in2="offset" operator="over"/>
    </filter>
  </defs>
  <text x="5.5" y="34.6" textLength="130.5" lengthAdjust="spacingAndGlyphs"
        style="font:700 30.5px JuraRemote,Jura,sans-serif;fill:#fff;filter:url(#logoShadow)">AISURVIV</text>
  <text x="139" y="34.6"
        style="font:700 30.5px JuraRemote,Jura,sans-serif;fill:#ffe400;filter:url(#logoShadow)">.IO</text>
  <text x="10.6" y="69.1"
        style="font:700 22.7542px JuraRemote,Jura,sans-serif;fill:#00ff0f">BATTLE ROYALE</text>
  <rect x="2.0777" y="3.6777" width="191.415" height="39.5693"
        fill="none" stroke="#fff" stroke-width="2.9554"/>
</svg>
